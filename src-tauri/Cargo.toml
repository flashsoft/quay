[package]
name = "frpc-desktop"
version = "0.1.0"
edition = "2021"
description = "Simple macOS tray wrapper for frpc"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["block2"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
